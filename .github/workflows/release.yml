name: Release

# Signed release builds.
#
# - Push a tag vMAJOR.MINOR.PATCH (on a commit that is on main): `build` signs and verifies the APK, then
#   `publish` creates the GitHub Release "Family Feed vX.Y.Z" with family-feed.apk and family-feed.apk.sha256.
# - Run manually (workflow_dispatch, from main only): a dry run. `build` does everything, signing included, and
#   uploads the APK as a short-lived workflow artifact. `publish` never runs: no tag, no release.
#
# Only `build` uses the `release` environment (and so the signing secrets). `publish` has no environment and no
# secrets, just contents: write to create the release.
#
# GitHub context is always passed to scripts through env:, never interpolated into run:, so tag or branch names
# cannot inject shell code.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    # No inputs: a manual run is always a dry run.

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, sign and verify APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    steps:
      - name: Check out
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check ref and derive version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$REF_TYPE" != "branch" ] || [ "$REF" != "refs/heads/main" ]; then
              echo "::error::A dry run may only be started from main (got $REF)."
              exit 1
            fi
            version_name="0.0.0-dryrun"
            version_code=1
            echo "Dry run from main: nothing will be published."
          elif [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            if [[ ! "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::Tag '$REF_NAME' is not of the form vMAJOR.MINOR.PATCH."
              exit 1
            fi
            major=${BASH_REMATCH[1]}
            minor=${BASH_REMATCH[2]}
            patch=${BASH_REMATCH[3]}
            # versionCode = MAJOR*10000 + MINOR*100 + PATCH only stays unique and increasing if these hold.
            if [ "$minor" -gt 99 ] || [ "$patch" -gt 99 ] || [ "$major" -gt 210000 ]; then
              echo "::error::MINOR and PATCH must be 0-99 and MAJOR at most 210000 (got $REF_NAME)."
              exit 1
            fi

            tag_commit=$(git rev-parse "refs/tags/${REF_NAME}^{commit}")
            if ! git rev-parse -q --verify refs/remotes/origin/main >/dev/null; then
              git fetch --no-tags origin main:refs/remotes/origin/main
            fi
            if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
              echo "::error::Tag $REF_NAME points to $tag_commit, which is not on origin/main."
              exit 1
            fi

            if out=$(gh api "repos/${REPO}/releases/tags/${REF_NAME}" 2>&1); then
              echo "::error::A GitHub Release already exists for $REF_NAME."
              exit 1
            elif ! grep -q 'HTTP 404' <<<"$out"; then
              echo "::error::Could not check for an existing release: $out"
              exit 1
            fi

            version_name=${REF_NAME#v}
            version_code=$((major * 10000 + minor * 100 + patch))
          else
            echo "::error::Unexpected trigger: $EVENT on $REF."
            exit 1
          fi
          echo "versionName=$version_name versionCode=$version_code"
          {
            echo "version_name=$version_name"
            echo "version_code=$version_code"
          } >> "$GITHUB_OUTPUT"

      - name: Check signing configuration
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          missing=()
          for name in ANDROID_SIGNING_KEY_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD \
              ANDROID_SIGNING_CERT_SHA256; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing or empty in the 'release' environment: ${missing[*]}"
            exit 1
          fi
          echo "All four signing secrets and ANDROID_SIGNING_CERT_SHA256 are set."

      - name: Set up JDK
        # actions/setup-java v6.1.0
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          # Matches gradle/gradle-daemon-jvm.properties (toolchainVersion=25).
          java-version: '25'

      - name: Set up Gradle
        # gradle/actions v6.4.0
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          validate-wrappers: true
          # Release builds read the cache but never write it.
          cache-read-only: true

      - name: Decode keystore
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_SIGNING_KEY_BASE64" | tr -d ' \r\n' | base64 --decode > "$keystore"
          if [ ! -s "$keystore" ]; then
            echo "::error::ANDROID_SIGNING_KEY_BASE64 decoded to an empty file."
            exit 1
          fi
          echo "Keystore decoded to the runner's temp directory."

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          # --no-configuration-cache: the signing values must not be stored in a configuration-cache entry.
          ./gradlew assembleRelease --no-configuration-cache \
            -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::$apk was not produced (an unsigned build means the signing variables were not used)."
            ls -l app/build/outputs/apk/release/ || true
            exit 1
          fi

      - name: Verify signature and certificate fingerprint
        env:
          EXPECTED_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: scripts/check-cert.sh app/build/outputs/apk/release/app-release.apk "$EXPECTED_SHA256"

      - name: Verify package name and version
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          build_tools=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          # Capture everything first: grep -m 1 in a pipe would kill aapt2 with SIGPIPE and fail under pipefail.
          all=$("$ANDROID_HOME/build-tools/$build_tools/aapt2" dump badging app/build/outputs/apk/release/app-release.apk)
          badging=$(awk '/^package:/ && !found { print; found = 1 }' <<<"$all")
          echo "$badging"
          name=$(printf '%s' "$badging" | sed -n "s/.* name='\([^']*\)'.*/\1/p")
          code=$(printf '%s' "$badging" | sed -n "s/.* versionCode='\([^']*\)'.*/\1/p")
          vname=$(printf '%s' "$badging" | sed -n "s/.* versionName='\([^']*\)'.*/\1/p")
          ok=true
          [ "$name" = "com.avinash.facebookfeed" ] || { echo "::error::applicationId is '$name', expected com.avinash.facebookfeed"; ok=false; }
          [ "$vname" = "$VERSION_NAME" ] || { echo "::error::versionName is '$vname', expected '$VERSION_NAME'"; ok=false; }
          [ "$code" = "$VERSION_CODE" ] || { echo "::error::versionCode is '$code', expected '$VERSION_CODE'"; ok=false; }
          $ok

      - name: Package APK and checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/family-feed.apk
          (cd dist && sha256sum family-feed.apk > family-feed.apk.sha256)
          cat dist/family-feed.apk.sha256

      - name: Upload artifact
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: family-feed-apk
          path: |
            dist/family-feed.apk
            dist/family-feed.apk.sha256
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'workflow_dispatch' && 1 || 7 }}

      - name: Delete keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

  publish:
    name: Publish GitHub Release
    needs: build
    # Tag pushes only. A dry run (workflow_dispatch) never gets here.
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download artifact
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: family-feed-apk
          path: dist

      - name: Check the checksum
        run: cd dist && sha256sum --check family-feed.apk.sha256

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::A release for $TAG already exists; not overwriting it."
            exit 1
          fi
          # Without --clobber, gh also refuses to replace an existing asset.
          # The notes below come first; GitHub's generated notes (changes since the last release) follow them.
          gh release create "$TAG" dist/family-feed.apk dist/family-feed.apk.sha256 \
            --repo "$REPO" --verify-tag --title "Family Feed $TAG" --generate-notes \
            --notes "Family Feed $TAG for Android TV. Install with \`adb install -r family-feed.apk\`; check the download against family-feed.apk.sha256."
