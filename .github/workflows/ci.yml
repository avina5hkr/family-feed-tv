name: CI

# Debug build on every push to main and every pull request. Never touches the release environment or any
# signing material.
#
# Lint is not run: `./gradlew lint` currently fails on a clean checkout (NewApi on
# RenderProcessGoneDetail.didCrash, and GestureBackNavigation for the KEYCODE_BACK handling).

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK
        # actions/setup-java v6.1.0
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          # Matches gradle/gradle-daemon-jvm.properties (toolchainVersion=25).
          java-version: '25'

      - name: Set up Gradle
        # gradle/actions v6.4.0
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          validate-wrappers: true

      - name: Assemble debug
        run: ./gradlew assembleDebug
